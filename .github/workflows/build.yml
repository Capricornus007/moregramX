name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# A new push supersedes the previous build; don't let ~15-min runs stack up.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker image prune -a -f

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Create local.properties
        run: |
          cat << 'EOF' > local.properties
          app.id=org.moregramx.mgx
          app.name=moregramX
          app.download_url=https://telegram.org/dlx
          telegram.api_id=23793598
          telegram.api_hash=273a536b9232da26405a3faa74c418f2
          youtube.api_key=
          tgx.extension=none
          app.experimental=false
          EOF
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Run Project Setup Script
        env:
          TERM: xterm
        run: |
          chmod +x scripts/setup.sh
          ./scripts/setup.sh

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Signing Keystore
        if: github.event_name == 'push'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            echo "KEYSTORE_PATH=$PWD/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASS=$STORE_PASS" >> $GITHUB_ENV
            echo "KEY_ALIAS=mgx" >> $GITHUB_ENV
            echo "org.gradle.jvmargs=-Xmx3g -XX:+UseG1GC" >> gradle.properties
            echo "RELEASE_STORE_FILE=$PWD/release.keystore" >> gradle.properties
            echo "RELEASE_STORE_PASSWORD=$STORE_PASS" >> gradle.properties
            echo "RELEASE_KEY_ALIAS=mgx" >> gradle.properties
            echo "RELEASE_KEY_PASSWORD=$STORE_PASS" >> gradle.properties
            echo "::notice:: Release signing enabled"
          else
            echo "::warning:: KEYSTORE_B64 or KEYSTORE_PASS secret not set, skipping release signing"
          fi

      # gradle.properties pins kotlin.compiler.execution.strategy=in-process purely to dodge a
      # Windows-only Kotlin daemon file-lock bug. On Linux that setting makes concurrent Kotlin
      # compilations share one JVM's IntelliJ-platform statics and crash at teardown with
      # "Write access is allowed inside write-action only". Use the default daemon strategy here, and
      # turn off the silent daemon->in-process fallback so a daemon problem fails loudly instead of
      # quietly reintroducing that race.
      #
      # The same invocation also bypasses the Gradle build cache. Which Kotlin compiler actually
      # does the work depends on the execution strategy -- in-process picks up the compiler on the
      # Gradle build classpath (emits metadata 2.4.0), the daemon uses the one AGP's built-in Kotlin
      # declares (2.2.0) -- yet the strategy is not a task input, so entries written under one
      # strategy are treated as valid under the other. That is precisely how 45f83e9e broke:
      # :vkryl:core, :vkryl:td, :extension:bridge and :extension:none came back FROM-CACHE carrying
      # metadata 2.4.0 (written by the previous in-process run, whose cache setup-java restores)
      # while :app compiled fresh at 2.2.0. Every error in that build was a downstream
      # "Unresolved reference" for a class the app could no longer read.
      - name: Build with Gradle
        run: |
          ./gradlew :app:assembleLatestArm64Release \
            --stacktrace --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:+UseG1GC" \
            -Pkotlin.compiler.execution.strategy=daemon \
            -Pkotlin.daemon.useFallbackStrategy=false \
            --no-build-cache

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: telegram-x-release-artifacts
          path: app/build/outputs/apk/**/*.apk

      - name: Delete old pre-release
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          # Wait a moment for GitHub to process the deletion
          sleep 3

      - name: Upload APK to Latest Release
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'push'
        with:
          tag_name: latest
          name: "Latest Release Build"
          body: "此為自動編譯產出的最新正式版 APK（使用自訂簽名），點擊下方檔案即可直接下載安裝。"
          prerelease: true
          make_latest: true
          files: app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
