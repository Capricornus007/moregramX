name: Java Compile Check

# Fast feedback loop: compiles only the app's Java for one variant
# (LatestArm64Debug) and skips the whole native CMake build, so merge /
# API-drift compile errors surface in a few minutes instead of ~30.
# The full APK is still produced by build.yml.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: java-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-check:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker image prune -a -f

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Create local.properties
        run: |
          cat << 'EOF' > local.properties
          app.id=org.moregramx.mgx
          app.name=moregramX
          app.download_url=https://telegram.org/dlx
          telegram.api_id=23793598
          telegram.api_hash=273a536b9232da26405a3faa74c418f2
          youtube.api_key=
          tgx.extension=none
          app.experimental=false
          EOF
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Run Project Setup Script
        env:
          TERM: xterm
        run: |
          chmod +x scripts/setup.sh
          ./scripts/setup.sh

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # gradle.properties pins kotlin.compiler.execution.strategy=in-process purely to dodge a
      # Windows-only Kotlin daemon file-lock bug. On Linux that setting makes concurrent Kotlin
      # compilations share one JVM's IntelliJ-platform statics and crash at teardown with
      # "Write access is allowed inside write-action only". Use the default daemon strategy here, and
      # turn off the silent daemon->in-process fallback so a daemon problem fails loudly instead of
      # quietly reintroducing that race.
      - name: Compile Java only (no native) — both SDK flavors
        run: |
          ./gradlew :app:compileLatestArm64DebugJavaWithJavac \
                    :app:compileLegacyArm32DebugJavaWithJavac \
            --stacktrace --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:+UseG1GC" \
            -Pkotlin.compiler.execution.strategy=daemon \
            -Pkotlin.daemon.useFallbackStrategy=false
