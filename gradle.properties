android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,EXTERNAL_NATIVE_BUILD_CONFIGURATION
org.gradle.jvmargs=-Xmx6G -Dkotlin.daemon.jvm.options\="-Xmx6G" -Dfile.encoding\=UTF-8

# NDK 27 (primary, 64-bit line) dropped API<21 support; no arm64 device exists
# below API 21, so suppress CXX1110 for the legacy-sdk x 64-bit flavor combo.
android.ndk.suppressMinSdkVersionError=21
