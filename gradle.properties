## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
#Mon Oct 06 14:09:17 EEST 2025
android.enableJetifier=false
android.nonFinalResIds=true
android.nonTransitiveRClass=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx6G -Dkotlin.daemon.jvm.options\="-Xmx6G" -Dfile.encoding\=UTF-8
org.gradle.parallel=true

# Fix Windows file lock issue: Run Kotlin compiler in-process instead of separate daemon
# The Kotlin daemon uses memory-mapped files that cause "user-mapped section open" errors on Windows
#
# Caveat, do not enable this blindly elsewhere: the Kotlin CLI compiler keeps IntelliJ-platform
# state (Application, Disposer, PSI file manager) in JVM statics, so two in-process compilations
# running concurrently inside the same Gradle worker JVM race on it and die at teardown with
#   AssertionError: Write access is allowed inside write-action only
#     UtilsKt.disposeRootInWriteAction -> PsiManagerImpl.dispose -> FileManagerImpl.clearViewProviders
# The race is latent whenever org.gradle.parallel is on, and became reproducible once
# org.gradle.isolated-projects below started scheduling sibling modules' Kotlin tasks together.
# The Windows lock bug this works around does not exist on Linux, so CI overrides the strategy
# back to the default 'daemon' on the command line -- see .github/workflows/*.yml.
kotlin.compiler.execution.strategy=in-process
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.isolated-projects=true
